<div class="page-header">
  <button class="btn btn-primary" (click)="!hasUpdateValue? addStockDetails() : updateStockDetails()">
     {{ !hasUpdateValue? "Add Stock" : "Update tock"}}
  </button>
</div>


<div class="ag-theme-alpine material-grid">
   @if(isBrowser){
      <ag-grid-angular
      [theme]="'legacy'"
      (gridReady)="onGridReady($event)"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [domLayout]="'autoHeight'"
      [pagination]="true"
      [paginationPageSize]="20"
      (cellValueChanged)="onChangeCellValue($event)"
      >
    </ag-grid-angular>
   }
</div>
