<div class="page-header">
  <!-- <h2>Manufacture List</h2> -->

  <button class="btn btn-primary" (click)="!hasUpdateValue? addManufactureDetails() : updateManufactureDetails()">
     {{ !hasUpdateValue? "Add Manufacture" : "Update Manufacture"}}
  </button>
</div>


<div class="ag-theme-alpine material-grid">
   @if(isBrowser){
      <ag-grid-angular
      [theme]="'legacy'"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [domLayout]="'autoHeight'"
      [pagination]="true"
      [paginationPageSize]="20"
      (gridReady)="onGridReady($event)"
      (cellValueChanged)="onChangeCellValue($event)"
      >
    </ag-grid-angular>
   }
</div>
