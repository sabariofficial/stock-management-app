

<div class="page-header">
  <!-- <h2>Material Management</h2> -->

  <button class="add-btn" (click)="!hasUpdateValue? openAddZinc() : updateZinc()">
     {{!hasUpdateValue? 'Add Zinc Details' : 'Update Zinc Details'}}
  </button>
</div>


<div class="ag-theme-alpine material-grid">
   <!-- @if(isBrowser && rowData.length){ -->
      <ag-grid-angular
      [theme]="'legacy'"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [domLayout]="'autoHeight'"
      [pagination]="true"
      [paginationPageSize]="20"
      (cellValueChanged)="onChangeCellValue($event)"
      >
    </ag-grid-angular>
   <!-- } -->
</div>
