

<div class="page-header">
  <!-- <h2>Material Management</h2> -->

  <button class="add-btn" (click)="!hasUpdateValue? openAddMaterial() : updateMaterial()">
     {{!hasUpdateValue? 'Add Material' : 'Update Material'}}
  </button>
</div>


<div class="ag-theme-alpine material-grid">
   @if(isBrowser && rowData.length){
      <ag-grid-angular
      [theme]="'legacy'"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [domLayout]="'autoHeight'"
      [pagination]="true"
      [paginationPageSize]="20"
      (cellValueChanged)="onChangeCellValue($event)"
      >
    </ag-grid-angular>
   }
</div>
