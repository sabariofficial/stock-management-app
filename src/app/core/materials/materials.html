

<div class="page-header">
  <h2>Material Management</h2>

  <button class="add-btn" (click)="openAddMaterial()">
     Add Material
  </button>
</div>


<div class="ag-theme-alpine material-grid">
   @if(isBrowser){
      <ag-grid-angular
      [theme]="'legacy'"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [pagination]="true"
      [paginationPageSize]="20"
      [domLayout]="'autoHeight'">
    </ag-grid-angular>
   }
</div>
